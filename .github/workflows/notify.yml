name: Notion Deadline Notifier

on:
  schedule:
    # 한국기준 매일 8시 정각에 실행
    # KST = UTC+9 이므로 UTC 기준 23:00
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

  push:
    branches:
      - main # main 브랜치에 push 되면 자동으로 workflow run
    paths-ignore:
      - 'README.md' # 문서 변경시엔 자동으로 run 되지않도록 ignore 처리
      - '*.md'

jobs:
  notify:
    runs-on: ubuntu-latest  # GitHub 서버(우분투)에서 실행

    steps:
      # 1. 저장소 코드 다운로드
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 패키지 설치
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. 스크립트 실행 (Secrets를 환경변수로 주입)
      - name: Run notifier
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DEADLINE_DATABASE_ID: ${{ secrets.NOTION_DEADLINE_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAYS_BEFORE: ${{ secrets.DAYS_BEFORE }}
        run: python notify.py